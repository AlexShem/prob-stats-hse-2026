# reveal.js slides, one deck per lecture (LNN-<slug>.qmd, same stem as book/lectures/).
# Write them with /slides LNN after the chapter is final. `make book` renders them, exports a PDF
# of each deck and copies both into the book output, where the chapter links to them.
project:
  output-dir: _output
filters:
  - ../_shared/slides.lua
execute:
  freeze: auto
  echo: false
format:
  revealjs:
    theme: [default, ../_shared/slides.scss]
    width: 1280
    height: 720
    margin: 0.06
    center: false
    slide-number: c/t
    logo: img/logo-hse-wide.png
    transition: none
    # Quarto's reveal math plugin is written for MathJax 2 (it calls MathJax.Hub), and Quarto 1.10
    # would point it at MathJax 4 on cdn.jsdelivr.net, which browsers here often cannot reach.
    # cdnjs loads from Russian networks; the PDF script swaps in a local copy of the same version.
    html-math-method:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js"
    chalkboard:
      buttons: false
    pdf-separate-fragments: false
    footer: "Probability Theory and Mathematical Statistics · HSE 2026/27"
    fig-width: 9
    fig-height: 4.6
