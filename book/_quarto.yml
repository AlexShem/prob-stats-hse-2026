# The course book: lectures + seminars in one place. Published as HTML; also a full PDF,
# per-chapter PDFs (book/_output/book/pdf/) and the slides (book/_output/book/slides/).
# Build with `make book` from the repo root, not `quarto render` alone (see CLAUDE.md).
project:
  type: book
  output-dir: _output/book

book:
  title: "Probability Theory and Mathematical Statistics"
  subtitle: "Lectures and seminars"
  author: "Aleksandr Shemendyuk"
  date: "2026/27"
  downloads: [pdf]
  chapters:
    - index.qmd
    - part: "Lectures"
      chapters:
        - lectures/L00-about-me.qmd
        - lectures/L01-probability-basics.qmd
        - lectures/L02-conditional-probability.qmd
        - lectures/L03-discrete-random-variables.qmd
    - part: "Seminars"
      chapters:
        - seminars/S01-counting.qmd
        - seminars/S02-conditional-probability.qmd
  appendices:
    - schedule.qmd

# Seminars whose solutions students can see (by number prefix). Add one after each seminar.
solutions-released: []

filters:
  - ../_shared/course.lua

execute:
  freeze: auto
  echo: false

format:
  html:
    theme: cosmo
    number-sections: true
    css: ../_shared/book.css
    # The default MathJax 4 comes from cdn.jsdelivr.net, which browsers here often cannot reach.
    html-math-method:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml-full.js"
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any]
    pdf-engine: xelatex
    monofont: "DejaVu Sans Mono"
    include-in-header: ../_shared/preamble.tex
    callout-icon: false
